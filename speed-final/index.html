<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>极速对抗 · 队内训练</title>
  <style>
    :root { color-scheme: light; --ink:#19243a; --muted:#495872; --line:#d3dcea; --blue:#234bd8; --paper:#eff2f8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 "Microsoft YaHei UI","PingFang SC",sans-serif; }
    main { width:min(100% - 32px,820px); margin:clamp(20px,6vw,62px) auto; }
    h1,h2,p { margin:0; } h1 { font-size:clamp(32px,7vw,53px); letter-spacing:-.055em; line-height:1.15; }
    h2 { font-size:21px; margin-bottom:5px; }
    header { background:#172d6c; color:white; border-radius:13px; padding:clamp(20px,5vw,36px); }
    header p { color:#d5e0f7; margin-top:8px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:14px 0; }
    section { background:white; border:1px solid var(--line); border-radius:10px; padding:17px; }
    section p { color:var(--muted); font-size:14px; }
    a,button,input { font:inherit; } a,button { display:inline-flex; align-items:center; min-height:44px; padding:7px 12px; border-radius:6px; border:1px solid var(--blue); background:var(--blue); color:white; text-decoration:none; cursor:pointer; font-weight:700; }
    .cards a { margin-top:10px; }
    form { display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
    input { min-width:0; flex:1 1 205px; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; text-transform:uppercase; }
    :focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    #message { margin-top:8px; color:#9b231a; }
    footer { margin-top:16px; color:var(--muted); font-size:14px; }
    @media (max-width:540px) { .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>极速对抗</h1><p>队内训练 · 单人练习与团队开房</p></header>
    <div class="cards">
      <section><h2>自己练</h2><p>在已启动原题库服务的电脑上，选择完整模拟或单练一轮。</p><a href="http://127.0.0.1:8765/practice">打开本机单人练习</a></section>
      <section><h2>团队开房</h2><p>房主在已启动原题库服务的电脑上开房，把邀请链接发给队友。</p><a href="http://127.0.0.1:8765/">打开本机房主页</a></section>
    </div>
    <section><h2>填写房间号</h2><p>和房主连同一个 Wi-Fi 或热点，填写 12 位同网房间号。收到完整邀请链接时，也可以直接打开。</p>
      <form id="join"><input name="code" placeholder="XXXX-XXXX-XXXX" aria-label="同网房间号" maxlength="20" autocomplete="off" spellcheck="false" required><button type="submit">加入房间</button></form>
      <p id="message" role="alert" hidden>请核对房主发来的 12 位同网房间号。</p>
    </section>
    <footer>原题库保存在房主电脑。目前支持同网联机，异地房间服务尚未接入。</footer>
  </main>
  <script>(function (root) {
  'use strict';

  const alphabet = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const port = '8765';
  const classB = 2 ** 24;
  const classC = classB + 2 ** 20;
  const roomMask = (1n << 30n) - 1n;

  function packAddress(address) {
    const octets = address.split('.').map(Number);
    if (octets.length !== 4 || octets.some(value => value < 0 || value > 255 || !Number.isInteger(value))) return null;
    const [first, second, third, fourth] = octets;
    if (first === 10) return second * 65536 + third * 256 + fourth;
    if (first === 172 && second >= 16 && second <= 31) return classB + (second - 16) * 65536 + third * 256 + fourth;
    if (first === 192 && second === 168) return classC + third * 256 + fourth;
    return null;
  }

  function unpackAddress(value) {
    if (value >= classC + 65536) return null;
    if (value >= classC) return `192.168.${Math.floor((value - classC) / 256)}.${value % 256}`;
    const high = value >= classB ? `172.${16 + Math.floor((value - classB) / 65536)}` : `10.${Math.floor(value / 65536)}`;
    return `${high}.${Math.floor(value / 256) % 256}.${value % 256}`;
  }

  function packDigits(digits) {
    return Array.from(digits).reduce((number, char) => (number << 5n) + BigInt(alphabet.indexOf(char)), 0n);
  }

  function digits(number, count) {
    const characters = Array(count);
    for (let index = count - 1; index >= 0; index -= 1) {
      characters[index] = alphabet[Number(number & 31n)];
      number >>= 5n;
    }
    return characters.join('');
  }

  function check(value) {
    const sum = Array.from(value).reduce((total, char, index) => total + (2 * index + 1) * alphabet.indexOf(char), 11);
    return alphabet[sum % 32];
  }

  function encode(address) {
    let url;
    try { url = new URL(address); } catch { return null; }
    const room = url.searchParams.get('room');
    const ip = packAddress(url.hostname);
    if (url.protocol !== 'http:' || url.port !== port || ip === null || !/^[2-9A-HJ-NP-Z]{6}$/.test(room || '')) return null;
    const payload = digits((BigInt(ip) << 30n) | packDigits(room), 11);
    return (payload + check(payload)).match(/.{4}/g).join('-');
  }

  function decode(code) {
    const normalized = code.normalize('NFKC').toUpperCase().replace(/[\s-]/g, '');
    if (!/^[2-9A-HJ-NP-Z]{12}$/.test(normalized)) return null;
    const payload = normalized.slice(0, 11);
    if (check(payload) !== normalized[11]) return null;
    const packed = packDigits(payload);
    const ip = unpackAddress(Number(packed >> 30n));
    return ip ? `http://${ip}:${port}/?room=${digits(packed & roomMask, 6)}` : null;
  }

  root.FinalsLanRoomCode = Object.freeze({ encode, decode });
})(globalThis);
</script>
  <script>
    document.querySelector('#join').addEventListener('submit', event => {
      event.preventDefault();
      const field = event.target.elements.code;
      const url = globalThis.FinalsLanRoomCode.decode(field.value);
      if (url) location.assign(url + '#join');
      else { document.querySelector('#message').hidden = false; field.focus(); }
    });
  </script>
</body>
</html>
