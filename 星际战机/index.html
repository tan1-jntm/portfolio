let currentStageIndex = 0;     // 当前关卡索引
let bossesDefeated = 0;       // 已击败的Boss数
let stageWaves;                // 当前关卡的波次数组（引用 STAGES[currentStageIndex].waves）

let waveSpawnTimer = 0;
let waveSpawnCount = 0;
let currentWaveIndex = 0;
let wavesComplete = false;

function getCurrentWaves() {
  return (gameMode === 'normal' && currentStageIndex < STAGES.length)
    ? STAGES[currentStageIndex].waves
    : WAVES_ENDLESS;
}

// 无尽模式回退波次（兼容旧逻辑）
const WAVES_ENDLESS = [
  { type: 'drone', count: 8, delay: 35 }, { type: 'rusher', count: 5, delay: 45 },
  { type: 'elite', count: 2, delay: 20 }, { type: 'drone', count: 12, delay: 30 },
  { type: 'rusher', count: 8, delay: 38 }, null,
];

function resetWaves() {
  currentWaveIndex = 0;
  waveSpawnTimer = 60;
  waveSpawnCount = 0;
  wavesComplete = false;
  stageWaves = getCurrentWaves();
}

function advanceToNextStage() {
  currentStageIndex++;
  bossesDefeated++;
  if (currentStageIndex < STAGES.length) {
    // 难度曲线：小怪随关卡稳定增强（每关 +12%），形成平滑成长对抗
    difficultyScale = 1 + currentStageIndex * 0.12;
    // 进入下一关：回复 + 武器升级奖励（成长感）
    player.hp = Math.min(player.maxHp, player.hp + (gameMode === 'bossrush' ? 4 : 2));   // Boss挑战回复更多
    player.missileAmmo = Math.min(player.maxMissile, player.missileAmmo + 2);
    player.weaponLevel = Math.min(5, player.weaponLevel + 1);
    resetWaves();
    // Boss 挑战模式：保持"直接打下一个 Boss"的连续流程
    if (gameMode === 'bossrush') stageWaves = [null];
    gameState = STATE.PLAYING;
    sfxPowerUp();
  } else {
    // 所有Boss都打完了
    gameState = STATE.VICTORY;
    saveLeaderboard();
    checkAchievements();
  }
}

function updateWaves(dt) {
  if (wavesComplete || gameState === STATE.BOSS || gameState === STATE.BOSS_INTRO) return;

  const WAVES_REF = stageWaves || getCurrentWaves();
  if (currentWaveIndex >= WAVES_REF.length) {
    wavesComplete = true;
    return;
  }

  const wave = WAVES_REF[currentWaveIndex];

  if (wave === null) {
    // Boss trigger — 当前关卡所有敌人清空后进入Boss战
    const allEnemiesDead = enemies.every(e => !e.active || e.type === 'boss');
    if (allEnemiesDead && currentWaveIndex >= WAVES_REF.length - 1) {
      gameState = STATE.BOSS_INTRO;
      bossIntroTimer = 120;
      sfxBossWarning();
      wavesComplete = true;
    }
    return;
  }

  waveSpawnTimer--;
  if (waveSpawnTimer <= 0 && waveSpawnCount < wave.count) {
    const x = 40 + Math.random() * (W - 80);
    const y = -30;
    if (wave.type === 'drone') spawnEnemy(x, y, 'drone');
    else if (wave.type === 'rusher') spawnEnemy(x, y, 'rusher');
    else if (wave.type === 'elite') spawnEnemy(x, y, 'elite');
    else if (wave.type === 'sniper') spawnEnemy(x, y, 'sniper');
    else if (wave.type === 'tank') spawnEnemy(x, y, 'tank');
    else if (wave.type === 'wisp') spawnEnemy(x, y, 'wisp');
    else if (wave.type === 'shaman') spawnEnemy(x, y, 'shaman');
    waveSpawnCount++;
    waveSpawnTimer = wave.delay;
  }

  if (waveSpawnCount >= wave.count) {
    const allDead = enemies.every(e => !e.active);
    if (allDead) {
      currentWaveIndex++;
      waveSpawnCount = 0;
      waveSpawnTimer = 60;
    }
  }
}

// ── 游戏重置 ───────────────────────────────────────────────
function resetGame() {
  // Clear all entities
  clearAllEntities();
  resetPlayer();
  // 重置关卡状态
  currentStageIndex = 0;
  bossesDefeated = 0;
  resetWaves();
  if (gameMode === 'bossrush') stageWaves = [null];   // Boss 挑战：直接进入 Boss 战
  score = 0;
  combo = 0;
  comboTimer = 0;
  maxCombo = 0;
  shakeTimer = 0;
  bossDefeated = false;
  endlessLap = 0;
  difficultyScale = 1.0;
  revived = false;
  redFlash = 0;
  comboPopups.length = 0;
  player._touchMissileCooldown = 0;
  gameState = STATE.PLAYING;
}

// ── 复活系统 ───────────────────────────────────────────────
function revivePlayer() {
  // 1. 先完全清除所有动态实体，避免池污染和状态不一致
  clearAllEntities();

  // 2. 重置玩家状态
  revived = true;
  player.hp = player.maxHp;
  player.invincible = 180; // 3秒无敌
  player.x = W / 2;
  player.y = H - 100;
  player.fireTimer = 0;

  // 3. 重置所有游戏状态标志
  bossDefeated = false;
  redFlash = 0;
  shakeTimer = 0;
  shakeIntensity = 0;
  combo = 0;
  comboTimer = 0;

  // 4. 清空连击弹窗
  comboPopups.length = 0;

  // 5. 重置波次
  resetWaves();
  waveSpawnTimer = 60;

  // 6. 恢复游戏状态
  gameState = STATE.PLAYING;

  // 7. 特效
  spawnParticles(player.x, player.y, 30, COLORS.neonGreen, 5, 25, 4);
  sfxPowerUp();

  // 8. 隐藏复活按钮
  const btnRevive = document.getElementById('btnRevive');
  if (btnRevive) btnRevive.style.display = 'none';
}

// 彻底清除所有实体（安全版本，避免 splice 过程中索引错乱）
function clearAllEntities() {
  // 清除子弹（全部）
  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].active = false;
    bulletPool.release(bullets[i]);
  }
  bullets.length = 0;

  // 清除敌机（全部）
  for (let i = enemies.length - 1; i >= 0; i--) {
    enemies[i].active = false;
    enemyPool.release(enemies[i]);
  }
  enemies.length = 0;

  // 清除道具
  for (let i = powerUps.length - 1; i >= 0; i--) {
    powerUps[i].active = false;
    powerUpPool.release(powerUps[i]);
  }
  powerUps.length = 0;

  // 清除粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    particlePool.release(particles[i]);
  }
  particles.length = 0;
}

// ── 更新 ───────────────────────────────────────────────────
function update(dt) {
  // 更新触摸控制可见性
  updateTouchControlsVisibility();

  // 处理触摸暂停
  if (touchPausePending) {
    touchPausePending = false;
    if (gameState === STATE.PAUSED) {
      gameState = STATE.PLAYING;
    } else if (gameState === STATE.PLAYING || gameState === STATE.BOSS) {
      gameState = STATE.PAUSED;
    }
  }

  // 处理触摸复活
  if (touchRevivePending) {
    touchRevivePending = false;
    if (gameState === STATE.GAMEOVER && !revived) {
      initAudio();
      revivePlayer();
    }
  }

  if (gameState === STATE.MENU) {
    // Mode toggle（三模式循环）
    if (keys['ArrowUp'] || keys['ArrowDown'] || keys['w'] || keys['W'] || keys['s'] || keys['S']) {
      if (gameMode === 'normal') gameMode = 'endless';
      else if (gameMode === 'endless') gameMode = 'bossrush';
      else gameMode = 'normal';
      sfxMenu();
      keys['ArrowUp'] = false; keys['ArrowDown'] = false;
      keys['w'] = false; keys['W'] = false; keys['s'] = false; keys['S'] = false;
    }
    if (keys['Enter'] || keys['enter']) {
      initAudio();
      resetGame();
      sfxMenu();
      keys['Enter'] = false;
      keys['enter'] = false;
    }
    // 自动瞄准辅助开关（A 键）
    if (keys['a'] || keys['A']) {
      autoAim = !autoAim;
      localStorage.setItem('starFighterAutoAim', autoAim ? '1' : '0');
      sfxMenu();
      keys['a'] = false; keys['A'] = false;
    }
    return;
  }

  if (gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) {
    // 复活（仅游戏结束且未复活过）
    if (gameState === STATE.GAMEOVER && !revived && (keys['r'] || keys['R'])) {
      keys['r'] = false; keys['R'] = false;
      initAudio();
      revivePlayer(); // 直接同步复活，不再走异步分享流程
    }
    if (keys['Enter'] || keys['enter']) {
      gameState = STATE.MENU;
      sfxMenu();
      keys['Enter'] = false;
      keys['enter'] = false;
    }
    return;
  }

  // 图鉴界面：纯静态展示，不跑任何游戏逻辑
  if (gameState === STATE.BESTIARY) return;

  // Pause
  if (keys['p'] || keys['P'] || keys['Escape']) {
    if (gameState === STATE.PAUSED) {
      gameState = STATE.PLAYING;
    } else if (gameState !== STATE.BOSS_INTRO) {
      gameState = STATE.PAUSED;
    }
    keys['p'] = false; keys['P'] = false; keys['Escape'] = false;
  }
  if (gameState === STATE.PAUSED) return;

  // Boss intro
  if (gameState === STATE.BOSS_INTRO) {
    bossIntroTimer--;
    if (bossIntroTimer <= 0) {
      gameState = STATE.BOSS;
      const boss = spawnEnemy(W / 2, -60, 'boss');
      boss.vy = 0;
      // 选择Boss配置：闯关用当前关；Boss挑战按顺序连打；无尽按轮次循环
      let stageIndex, hpMul = 1, speedMul = 1;
      if (gameMode === 'normal' && currentStageIndex < STAGES.length) {
        stageIndex = currentStageIndex;
      } else if (gameMode === 'bossrush' && currentStageIndex < STAGES.length) {
        stageIndex = currentStageIndex;   // Boss 挑战：第 1 → 第 5 顺序连打
        hpMul = 0.6; speedMul = 0.85;     // Boss 挑战专属削弱：保证连续 5 战可过
      } else {
        stageIndex = endlessLap % STAGES.length;  // 无尽：循环5个Boss
        hpMul = 0.7; speedMul = 0.9;              // 无尽难度更低
      }
      const sc = STAGES[stageIndex].bossConfig;
      boss.width = sc.width; boss.height = sc.height;
      boss.hp = Math.ceil(sc.hp * hpMul * difficultyScale); boss.maxHp = boss.hp;
      boss.fireBase = Math.round(sc.fireIntervalBase * (gameMode === 'bossrush' ? 1.3 : (hpMul < 1 ? 1.15 : 1))); // Boss挑战射击更稀疏
      boss.phaseThresholds = sc.phaseThresholds || [0.65, 0.3];
      boss.bossSpeed = sc.speed * speedMul;
      boss.bossName = STAGES[stageIndex].bossName;
      boss.bossImgSrc = STAGES[stageIndex].bossImgSrc;
      // 预加载Boss图片并记录宽高比（drawBoss 按比例绘制，不变形）
      if (boss.bossImgSrc) {
        boss.img = new Image();
        boss.img.onload = () => { if (boss.img.naturalWidth) boss.imgAspect = boss.img.naturalWidth / boss.img.naturalHeight; };
        boss.img.src = boss.bossImgSrc;
      }
      spawnParticles(W / 2, 0, 30, COLORS.warnRed, 5, 30, 5);
      shakeTimer = 15; shakeIntensity = 5;
    }
    return;
  }

  // Player movement
  let dx = 0, dy = 0;
  let usingKeyboard = false;

  // 触摸摇杆输入
  if (touchJoystickActive && (Math.abs(touchJoystickDX) > 0.05 || Math.abs(touchJoystickDY) > 0.05)) {
    dx = touchJoystickDX;
    dy = touchJoystickDY;
    usingKeyboard = true; // 标记为手动控制，避免鼠标干扰
  }

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx -= 1; usingKeyboard = true; }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx += 1; usingKeyboard = true; }
  if (keys['ArrowUp'] || keys['w'] || keys['W']) { dy -= 1; usingKeyboard = true; }
  if (keys['ArrowDown'] || keys['s'] || keys['S']) { dy += 1; usingKeyboard = true; }

  if (usingKeyboard) mouseActive = false;

  if (mouseActive && !usingKeyboard) {
    // Mouse control: smooth follow
    const mx = mouseX - player.x;
    const my = mouseY - player.y;
    const dist = Math.sqrt(mx * mx + my * my);
    if (dist > 2) {
      dx = mx / dist;
      dy = my / dist;
      // Speed scales with distance for snappy feel
      const speed = Math.min(player.speed * 1.2, dist * 0.15);
      player.x += dx * speed * dt;
      player.y += dy * speed * dt;
    }
  } else if (dx !== 0 || dy !== 0) {
    const len = Math.sqrt(dx * dx + dy * dy);
    dx /= len; dy /= len;
    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;
  }
  player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(H - player.height / 2, player.y));

  // Invincibility
  if (player.invincible > 0) player.invincible--;

  // Shooting
  playerShoot();

  // Missile (Space or left click or touch button)
  // 触摸导弹按钮有冷却时间，防止连续发射
  if (touchMissile && !player._touchMissileCooldown) {
    player._touchMissileCooldown = 15; // ~0.25s cooldown
  }
  if (player._touchMissileCooldown > 0) {
    player._touchMissileCooldown--;
  }

  const canFireMissile = (keys[' '] || mouseDown || (touchMissile && player._touchMissileCooldown === 14)) && player.missileAmmo > 0;
  if (canFireMissile) {
    player.missileAmmo--;
    keys[' '] = false;
    mouseDown = false;
    const bm = spawnBullet(player.x, player.y - player.height / 2, 0, -8, 6, 6, 5, false, COLORS.neonBlue);
    bm.tracking = true;
  }

  // Combo timer
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) combo = 0;
  }

  // Screen shake
  if (shakeTimer > 0) shakeTimer--;

  // Updates
  updateStars(dt);
  updateShootingStars(dt);
  updateShockwaves(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updatePowerUps(dt);
  updateParticles(dt);
  updateWaves(dt);
  updateComboPopups();
  if (redFlash > 0) redFlash--;
}

// ── 渲染 ───────────────────────────────────────────────────
function render() {
  const sx = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;
  const sy = shakeTimer > 0 ? (Math.random() - 0.5) * shakeIntensity : 0;

  ctx.save();
  ctx.translate(sx, sy);

  // Background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(-10, -10, W + 20, H + 20);
  drawNebula(ctx);
  // 背景流光带（青/粉两条缓慢游走，场景活起来）
  if (!__bgBand1) { __bgBand1 = ctx.createRadialGradient(0, 0, 0, 0, 0, 120); __bgBand1.addColorStop(0, 'rgba(0,240,255,.08)'); __bgBand1.addColorStop(1, 'rgba(0,240,255,0)'); }
  if (!__bgBand2) { __bgBand2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 120); __bgBand2.addColorStop(0, 'rgba(255,54,200,.07)'); __bgBand2.addColorStop(1, 'rgba(255,54,200,0)'); }
  ctx.save();
  ctx.translate(W * 0.5 + Math.sin(Date.now() * 0.0003) * W * 0.35, H * 0.35 + Math.cos(Date.now() * 0.0004) * H * 0.3);
  ctx.fillStyle = __bgBand1; ctx.fillRect(-120, -120, 240, 240);
  ctx.restore();
  ctx.save();
  ctx.translate(W * 0.5 + Math.sin(Date.now() * 0.0005 + 2) * W * 0.38, H * 0.72 + Math.cos(Date.now() * 0.0006 + 1) * H * 0.28);
  ctx.fillStyle = __bgBand2; ctx.fillRect(-120, -120, 240, 240);
  ctx.restore();
  // Boss 战氛围：红色警示光晕笼罩全场
  const inBossFight = enemies.some(ee => ee.type === 'boss' && ee.active) || gameState === STATE.BOSS_INTRO || gameState === STATE.BOSS;
  if (inBossFight) {
    if (!__nebula3) {
      __nebula3 = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, W * 0.6);
      __nebula3.addColorStop(0, 'rgba(255,40,80,.12)'); __nebula3.addColorStop(1, 'rgba(255,40,80,0)');
    }
    ctx.fillStyle = __nebula3; ctx.fillRect(-10, -10, W + 20, H + 20);
  }
  drawStars(ctx);
  drawShootingStars(ctx);
  drawShockwaves(ctx);
  // 连击 10+：屏幕边缘金色辉光（高连击的荣耀感）
  if (combo >= 10) {
    if (!__edgeGrad) {
      __edgeGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.62);
      __edgeGrad.addColorStop(0, 'rgba(0,0,0,0)'); __edgeGrad.addColorStop(1, 'rgba(255,211,77,1)');
    }
    ctx.save();
    ctx.globalAlpha = Math.min(0.28, combo / 45) * (0.6 + 0.4 * Math.sin(Date.now() * 0.005));
    ctx.fillStyle = __edgeGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Draw entities
  drawPlayer();
  for (const e of enemies) { if (e.active) drawEnemy(e); }
  for (const b of bullets) { if (b.active) drawBullet(b); }
  drawParticles(ctx);
  for (const p of powerUps) { if (p.active) drawPowerUp(p); }

  // HUD
  drawHUD();

  // Combo popups
  for (const cp of comboPopups) {
    const alpha = cp.life / cp.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = cp.color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = cp.color;
    ctx.translate(W / 2, H / 2 - 80);
    ctx.scale(cp.scale, cp.scale);
    ctx.fillText(cp.text, 0, 0);
    ctx.restore();
  }

  // 连击爆屏大字（combo ≥ 5 中央金字）
  if (comboFlash) {
    comboFlash.life--;
    if (comboFlash.life <= 0) comboFlash = null;
    else {
      const cpr = 1 - comboFlash.life / comboFlash.max;
      ctx.save();
      ctx.globalAlpha = Math.min(1, comboFlash.life / comboFlash.max * 2);
      ctx.translate(W / 2, H * 0.3 - cpr * 20);
      ctx.scale(1 + cpr * 0.5, 1 + cpr * 0.5);
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = COLORS.neonGold;
      ctx.shadowBlur = 20;
      ctx.fillStyle = COLORS.neonGold;
      ctx.fillText(comboFlash.text, 0, 0);
      ctx.restore();
    }
  }

  // 暴击小字（上浮消散）
  for (let i = critPops.length - 1; i >= 0; i--) {
    const cp2 = critPops[i];
    cp2.life--;
    if (cp2.life <= 0) { critPops.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, cp2.life / cp2.max * 2);
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = COLORS.neonGold;
    ctx.shadowBlur = 10;
    ctx.fillStyle = COLORS.neonGold;
    ctx.fillText(cp2.text, cp2.x, cp2.y - (1 - cp2.life / cp2.max) * 16);
    ctx.restore();
  }

  ctx.restore();

  // Overlays (no shake)
  // Red flash effect for boss mode switch
  if (redFlash > 0) {
    ctx.fillStyle = 'rgba(255, 0, 0, ' + (redFlash / 25) * 0.3 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (gameState === STATE.MENU) drawMenu();
  if (gameState === STATE.BOSS_INTRO) drawBossIntro();
  if (gameState === STATE.PAUSED) drawPauseOverlay();
  if (gameState === STATE.GAMEOVER) drawGameOver();
  if (gameState === STATE.VICTORY) drawVictory();
  if (gameState === STATE.BESTIARY) drawBestiary();
}

// ── 游戏循环 ───────────────────────────────────────────────
let lastTime = 0;

function gameLoop(timestamp) {
  const rawDt = timestamp - lastTime;
  lastTime = timestamp;
  const dt = Math.min(rawDt, 50) / FIXED_DT;
  // 时间减速/慢动作（道具 + Boss 击杀特写）
  if (slowmoTimer > 0) slowmoTimer--;
  const effDt = slowmoTimer > 0 ? dt * 0.4 : dt;

  update(effDt);
  checkCollisions();
  render();

  requestAnimationFrame(gameLoop);
}

// ── 启动 ───────────────────────────────────────────────────
gameState = STATE.MENU;
requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
